name: Ranorex Mobile CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ranorex-mobile-test:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show environment
        shell: powershell
        run: |
          Write-Host "Runner machine:"
          hostname

          Write-Host "Current directory:"
          Get-Location

          Write-Host "ADB version:"
          & "C:\Users\mo_ba\AppData\Local\Android\Sdk\platform-tools\adb.exe" version

          Write-Host "Connected Android devices:"
          & "C:\Users\mo_ba\AppData\Local\Android\Sdk\platform-tools\adb.exe" devices

      - name: Check Ranorex installation
        shell: powershell
        run: |
          $ranorexBin = "C:\Program Files (x86)\Ranorex\Studio\Bin"

          if (Test-Path $ranorexBin) {
              Write-Host "Ranorex installation found:"
              Write-Host $ranorexBin
          }
          else {
              Write-Error "Ranorex installation was not found."
              exit 1
          }

      - name: Build Ranorex solution
        shell: powershell
        run: |
          $msbuild = "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\MSBuild\Current\Bin\MSBuild.exe"

          if (-not (Test-Path $msbuild)) {
              Write-Error "MSBuild was not found: $msbuild"
              exit 1
          }

          Write-Host "Building RanorexMobileTest.sln..."

          & $msbuild ".\RanorexMobileTest.sln" `
            /t:Rebuild `
            /p:Configuration=Debug

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Ranorex solution build failed."
              exit $LASTEXITCODE
          }

          Write-Host "Ranorex solution build completed successfully."


      - name: Show build outputs
        shell: powershell
        run: |
          Write-Host "=== Ranorex build outputs ==="

          Get-ChildItem -Path ".\RanorexMobileTest" `
            -Recurse `
            -Include *.exe,*.rxtst |
          ForEach-Object {
              Write-Host $_.FullName
          }

      - name: Check Android emulator
        shell: powershell
        run: |
          $adb = "C:\Users\mo_ba\AppData\Local\Android\Sdk\platform-tools\adb.exe"
          $deviceId = "emulator-5554"

          Write-Host "=== Connected Android devices ==="
          & $adb devices

          Write-Host "=== Checking $deviceId state ==="

          $state = (& $adb -s $deviceId get-state 2>&1 | Out-String).Trim()

          Write-Host "Device state: [$state]"

          if ($LASTEXITCODE -ne 0 -or $state -ne "device") {
              throw "Android emulator $deviceId is not ready. State=[$state]"
          }

          Write-Host "Android emulator $deviceId is ready."

      - name: Run Ranorex mobile tests
        shell: powershell
        run: |
          $testExe = Join-Path $env:GITHUB_WORKSPACE `
            "RanorexMobileTest\bin\Debug\RanorexMobileTest.exe"

          $testSuite = Join-Path $env:GITHUB_WORKSPACE `
            "RanorexMobileTest\bin\Debug\RanorexMobileTest.rxtst"

          $reportDir = Join-Path $env:GITHUB_WORKSPACE "RanorexReports"

          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null

          $testCases = @(
              "TC01_Login_Failed",
              "TC02_Login_Success",
              "TC01_ProductList",
              "TC02_ProductDetail",
              "TC03_AddToCart"
          )

          foreach ($testCase in $testCases) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "Running: $testCase"
              Write-Host "======================================"

              $reportFile = Join-Path $reportDir "$testCase.rxlog"

              & $testExe `
                "/ts:$testSuite" `
                "/ep:emulator-5554" `
                "/tc:$testCase" `
                "/rf:$reportFile" `
                "/ju"

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "$testCase failed. ExitCode=$LASTEXITCODE"
                  exit $LASTEXITCODE
              }

              Write-Host "$testCase completed successfully."
          }

          Write-Host ""
          Write-Host "All Ranorex Android tests passed."

      - name: Upload Ranorex reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranorex-mobile-reports
          path: RanorexReports/
          if-no-files-found: warn

